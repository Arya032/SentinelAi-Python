name: Build & Release SentinelAI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install psutil pefile requests plyer pillow pywin32
          pip install pystray
          pip install joblib scikit-learn
        shell: cmd

      - name: Build exe with PyInstaller
        run: python -m PyInstaller sentinelai_build.spec --clean --noconfirm
        shell: cmd

      - name: Build self-extracting installer (PowerShell, no Inno Setup needed)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\installer" | Out-Null

          # Bundle the dist folder + service + install scripts into a zip
          $zipPath = "dist\installer\SentinelAI-Files.zip"
          Compress-Archive -Path "dist\SentinelAI\*", "sentinelai_service.py", "install.bat", "uninstall.bat" -DestinationPath $zipPath -Force

          # Create a self-extracting PowerShell installer (SentinelAI-Setup.ps1)
          # Users: right-click -> Run with PowerShell
          $sfx = @'
          # SentinelAI Self-Extracting Installer
          # Right-click this file and choose "Run with PowerShell"
          $ErrorActionPreference = "Stop"
          Write-Host "Installing SentinelAI..." -ForegroundColor Cyan
          $dest = "$env:ProgramFiles\SentinelAI"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = "$PSScriptRoot\SentinelAI-Files.zip"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $py = (Get-Command python -ErrorAction SilentlyContinue)?.Source
          if (!$py) { Write-Host "[ERROR] Python not found. Install from python.org" -ForegroundColor Red; pause; exit 1 }
          sc.exe create SentinelAIEDR binPath= "`"$py`" `"$dest\sentinelai_service.py`"" start= auto DisplayName= "SentinelAI - Enterprise Cyber Defense"
          sc.exe start SentinelAIEDR
          Write-Host "SentinelAI installed and running!" -ForegroundColor Green
          pause
          '@
          $sfx | Out-File -FilePath "dist\installer\Install-SentinelAI.ps1" -Encoding UTF8

          Write-Host "Installer package ready in dist\installer\"
          Get-ChildItem "dist\installer\"

      - name: Get version tag
        id: version
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)
          $ver = "v1.0.0-$sha"
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "SentinelAI ${{ steps.version.outputs.VERSION }}"
          body: |
            ## SentinelAI — Enterprise Cyber Defense

            ### How to install
            1. Download `SentinelAI-Files.zip` below
            2. Extract to a folder
            3. Right-click `Install-SentinelAI.ps1` → **Run with PowerShell**
            4. Done — runs silently in background at every boot

            ### What's included
            - ✅ 13 behavioral detection modules
            - ✅ Ransomware, zero-day, LOLBAS, LSASS, memory injection detection
            - ✅ Runs as Windows Service (no login needed)
            - ✅ Auto-restart on failure
            - ✅ Windows 10/11 (64-bit)

          files: |
            dist/installer/SentinelAI-Files.zip
            dist/installer/Install-SentinelAI.ps1
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
